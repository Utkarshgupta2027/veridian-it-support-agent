services:
  app:
    build:
      context: .
    image: veridian-it-agent:latest
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL:?Set DB_URL in your environment or .env file}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in your environment or .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    restart: unless-stopped
