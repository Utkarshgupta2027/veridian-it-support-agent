spring.application.name=veridian-it-agent
server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/veridian_agent;MODE=MySQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app.llm.api-key=${OPENAI_API_KEY:}
app.llm.model=${OPENAI_MODEL:gpt-4o-mini}
app.llm.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}