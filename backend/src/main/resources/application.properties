spring.application.name=veridian-it-agent
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/veridian_agent}
spring.datasource.username=${DB_USERNAME:veridian_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app.llm.api-key=${OPENAI_API_KEY:}
app.llm.model=${OPENAI_MODEL:gpt-4o-mini}
app.llm.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
