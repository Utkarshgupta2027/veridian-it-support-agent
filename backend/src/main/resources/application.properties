spring.application.name=veridian-it-agent

# Render provides PORT automatically
server.port=${PORT:8080}

# PostgreSQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Optional LLM
app.llm.api-key=${OPENAI_API_KEY:}
app.llm.model=${OPENAI_MODEL:gpt-4o-mini}
app.llm.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}